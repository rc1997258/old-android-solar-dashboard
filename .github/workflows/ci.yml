name: CI

on:
  push:
  pull_request:

jobs:
  tapo-logger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-kasa (used by the simulated plug)
        run: pip install python-kasa
      - name: Protocol, history and graph tests
        run: tapo-logger/test/run_tests.sh

  tapo-logger-apk:
    runs-on: ubuntu-latest
    needs: tapo-logger-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools (Ubuntu packages, no Android Studio)
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner dalvik-exchange android-sdk-platform-23
      - name: Build APK (signed with a throwaway CI debug key)
        run: tapo-logger/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TapoLogger-ci-debug
          path: tapo-logger/TapoLogger.apk

  soyosource-patcher-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile soyosource-patcher/patch_soyo.py soyosource-patcher/tools/scale_res.py
          bash -n soyosource-patcher/build_install.sh
          python soyosource-patcher/patch_soyo.py --help > /dev/null
